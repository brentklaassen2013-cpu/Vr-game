<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#0d1017" />
<title>Crazy Office: Night Shift — Reborn 1.6 · VIDEO FIXES + POTATO SKIN</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070910;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#fff}#game{width:100%;height:100%;touch-action:none;display:block}#boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 35%,#20263a 0,#0b0e16 42%,#05070b 100%);z-index:20;gap:10px}.brand{font-weight:1000;letter-spacing:.08em;font-size:clamp(44px,10vw,90px);transform:skew(-5deg);text-shadow:0 8px 30px #000}.subtitle{letter-spacing:.5em;font-size:14px;opacity:.7;margin-bottom:20px}button{border:1px solid #ffffff33;background:#ffffff0d;color:#fff;font-weight:800;padding:13px 24px;border-radius:999px;min-width:220px;backdrop-filter:blur(12px)}button:hover{background:#ffffff1a}.note,#bootStatus{opacity:.62;font-size:12px;max-width:440px;text-align:center}.note{margin-top:14px}#hud{position:fixed;left:14px;top:14px;display:none;flex-direction:column;gap:8px;z-index:5;pointer-events:none}.pill,.meter{background:#0a0d14cc;border:1px solid #ffffff20;border-radius:14px;padding:8px 11px;backdrop-filter:blur(12px);box-shadow:0 10px 30px #0005}.pill{display:flex;gap:10px;align-items:center}.pill span{opacity:.62}.pill.small{width:max-content}.meter{display:grid;grid-template-columns:52px 120px 42px;align-items:center;gap:8px;font-size:12px}.meter i{height:7px;border-radius:999px;background:#ffffff15;overflow:hidden}.meter i b{height:100%;display:block;width:100%;background:white;border-radius:999px;transition:width .15s}#toast{position:fixed;left:50%;bottom:12%;transform:translateX(-50%);font-weight:900;font-size:clamp(18px,3vw,30px);text-align:center;text-shadow:0 4px 20px #000;pointer-events:none;z-index:6;opacity:0;transition:opacity .18s}.show{opacity:1!important}

</style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="boot">
    <div class="brand">CRAZY OFFICE</div>
    <div class="subtitle">NIGHT SHIFT · REBORN 1.6 · VIDEO FIXES + POTATO SKIN</div>
    <div id="bootStatus">Starting engine…</div>
    <button id="enterVR" disabled>ENTER VR</button>
    <button id="desktopStart" disabled>DESKTOP PREVIEW</button>
    <div class="note">Joystick movement is active for this build.<br>Left stick move · right stick snap-turn · Gorilla movement returns later.</div>
  </div>
  <div id="hud">
    <div class="pill"><b id="modeText">ELEVATOR HUB</b><span id="shiftText">Choose a shift</span></div>
    <div class="meter"><span>HP</span><i><b id="hpBar"></b></i><strong id="hpText">100</strong></div>
    <div class="meter"><span>BAT</span><i><b id="batBar"></b></i><strong id="batText">100%</strong></div>
    <div class="meter"><span>CHAOS</span><i><b id="chaosBar"></b></i><strong id="chaosText">0%</strong></div>
    <div class="pill small"><span>RANK</span><b id="rankText">D</b><span id="scoreText">0</span></div>
  </div>
  <div id="toast"></div>
<script>
(function(){
  const status=document.getElementById('bootStatus'), enter=document.getElementById('enterVR'), preview=document.getElementById('desktopStart');
  let finished=false;
  const cdns=['https://cdn.babylonjs.com/babylon.js','https://cdn.jsdelivr.net/npm/babylonjs@7.54.3/babylon.js','https://unpkg.com/babylonjs@7.54.3/babylon.js'];
  function fatal(msg){finished=true;status.textContent='LOAD ERROR • '+msg;enter.disabled=true;preview.disabled=true;}
  window.addEventListener('error',e=>{if(!finished)status.textContent='LOAD ERROR • '+(e.message||'unknown error');});
  async function loadScript(url){return new Promise((ok,bad)=>{const s=document.createElement('script');s.src=url;s.onload=ok;s.onerror=bad;document.head.appendChild(s);});}
  async function boot(){
    for(let i=0;i<cdns.length&&!window.BABYLON;i++){
      status.textContent='Loading 3D engine '+(i+1)+'/'+cdns.length+'…';
      try{await Promise.race([loadScript(cdns[i]),new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),7000))]);}catch(e){}
    }
    if(!window.BABYLON){fatal('3D engine could not load. Check internet/HTTPS and refresh.');return;}
    status.textContent='Building Crazy Office…';
    try{await import('./game.js?v=14'); finished=true; enter.disabled=false; preview.disabled=false;}
    catch(e){console.error(e);fatal(e?.message||'game code failed');}
  }
  setTimeout(()=>{if(!finished&&status.textContent.startsWith('Starting'))status.textContent='Still loading… trying fallback engine.';},4000);
  boot();
})();
</script>
</body>
</html>
