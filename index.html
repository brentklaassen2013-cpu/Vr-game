<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#0d1017" />
<title>Crazy Office: Night Shift — Reborn 4.3 · COZY LOBBY</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070910;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#fff}#game{width:100%;height:100%;touch-action:none;display:block}#boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 35%,#20263a 0,#0b0e16 42%,#05070b 100%);z-index:20;gap:10px}.brand{font-weight:1000;letter-spacing:.08em;font-size:clamp(44px,10vw,90px);transform:skew(-5deg);text-shadow:0 8px 30px #000}.subtitle{letter-spacing:.5em;font-size:14px;opacity:.7;margin-bottom:20px}button{border:1px solid #ffffff33;background:#ffffff0d;color:#fff;font-weight:800;padding:13px 24px;border-radius:999px;min-width:220px;backdrop-filter:blur(12px)}button:hover{background:#ffffff1a}.note,#bootStatus{opacity:.62;font-size:12px;max-width:440px;text-align:center}.note{margin-top:14px}#hud{position:fixed;left:max(16px,env(safe-area-inset-left));top:max(16px,env(safe-area-inset-top));display:none;flex-direction:column;gap:8px;z-index:50;pointer-events:none;max-width:min(92vw,430px)}.pill,.meter{background:#05080eef;border:2px solid #ffffff32;border-radius:14px;padding:10px 12px;backdrop-filter:blur(12px);box-shadow:0 10px 30px #0005}.pill{display:flex;gap:8px;align-items:center;font-size:14px;white-space:nowrap;overflow:hidden}.pill span{opacity:.62}.pill.small{width:max-content}.meter{display:grid;grid-template-columns:64px minmax(170px,240px) 82px;align-items:center;gap:8px;font-size:14px;font-weight:900}.meter i{height:12px;border-radius:999px;background:#ffffff15;overflow:hidden}.meter i b{height:100%;display:block;width:100%;background:white;border-radius:999px;transition:width .15s}#toast{position:fixed;left:50%;bottom:12%;transform:translateX(-50%);font-weight:900;font-size:clamp(18px,3vw,30px);text-align:center;text-shadow:0 4px 20px #000;pointer-events:none;z-index:6;opacity:0;transition:opacity .18s}.show{opacity:1!important}

</style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="boot">
    <div class="brand">CRAZY OFFICE</div>
    <div class="subtitle">REBORN 4.3 · COZY LOBBY + COSMETICS ROOM</div>
    <div id="bootStatus">Starting engine…</div>
    <button id="enterVR" disabled>ENTER VR</button>
    <button id="desktopStart" disabled>DESKTOP PREVIEW</button>
    <div class="note">Left stick move · right stick snap-turn.<br>Explore the cozy lobby, walk into the cosmetics room, then choose SURVIVAL or LEVELS.</div>
  </div>
  <div id="hud">
    <div class="pill"><b id="modeText">ELEVATOR HUB</b><span id="shiftText">Choose a shift</span></div>
    <div class="meter" style="border-color:#ff5666aa;background:#12080bef"><span>HP</span><i><b id="hpBar"></b></i><strong id="hpText">100</strong></div>
    <div class="meter"><span>BAT</span><i><b id="batBar"></b></i><strong id="batText">100%</strong></div>
    <div class="meter"><span>CHAOS</span><i><b id="chaosBar"></b></i><strong id="chaosText">0%</strong></div>
    <div class="pill small"><span>RANK</span><b id="rankText">D</b><span id="scoreText">0</span></div>
  </div>
  <div id="toast"></div>
<script>
(function(){
  const status=document.getElementById('bootStatus'), enter=document.getElementById('enterVR'), preview=document.getElementById('desktopStart');
  let finished=false;
  const cdns=['https://cdn.babylonjs.com/babylon.js','https://cdn.jsdelivr.net/npm/babylonjs@7.54.3/babylon.js','https://unpkg.com/babylonjs@7.54.3/babylon.js'];
  const loaderCdns=['https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js','https://cdn.jsdelivr.net/npm/babylonjs-loaders@7.54.3/babylonjs.loaders.min.js','https://unpkg.com/babylonjs-loaders@7.54.3/babylonjs.loaders.min.js'];
  function fatal(msg){finished=true;status.textContent='LOAD ERROR • '+msg;enter.disabled=true;preview.disabled=true;}
  window.addEventListener('error',e=>{ if(!finished){ console.error(e.error||e.message); status.textContent='LOAD ERROR • '+(e.message||'unknown error'); }});
  window.addEventListener('unhandledrejection',e=>{ if(!finished){ console.error(e.reason); status.textContent='LOAD ERROR • '+(e.reason?.message||'startup failed'); }});
  function loadClassic(url,timeout=8000){return new Promise((ok,bad)=>{let done=false;const s=document.createElement('script');const t=setTimeout(()=>{if(done)return;done=true;s.remove();bad(new Error('timeout'));},timeout);s.src=url;s.async=true;s.onload=()=>{if(done)return;done=true;clearTimeout(t);ok();};s.onerror=()=>{if(done)return;done=true;clearTimeout(t);s.remove();bad(new Error('script failed'));};document.head.appendChild(s);});}
  async function loadGameRobust(){try{return await loadClassic('./game.js?build=43',9000);}catch(first){console.warn('Direct game.js load failed; trying text/blob fallback.',first);const r=await fetch('./game.js?build=43',{cache:'no-store'});if(!r.ok)throw new Error('game.js HTTP '+r.status);const code=await r.text();if(code.length<1000)throw new Error('game.js response was incomplete');const blob=URL.createObjectURL(new Blob([code],{type:'text/javascript'}));try{await loadClassic(blob,9000);}finally{URL.revokeObjectURL(blob);}}}
  async function boot(){
    for(let i=0;i<cdns.length&&!window.BABYLON;i++){
      status.textContent='Loading 3D engine '+(i+1)+'/'+cdns.length+'…';
      try{await loadClassic(cdns[i],7000);}catch(e){console.warn('Engine source failed',cdns[i],e);}
    }
    if(!window.BABYLON){fatal('3D engine unavailable. Check HTTPS/internet, then refresh.');return;}
    status.textContent='Loading free model support…';
    let loaderReady=false;
    for(let i=0;i<loaderCdns.length&&!loaderReady;i++){
      try{await loadClassic(loaderCdns[i],6500);loaderReady=true;}catch(e){console.warn('Model loader source failed',loaderCdns[i],e);}
    }
    window.__CRAZY_REMOTE_MODEL_LOADER=loaderReady;
    status.textContent='Building Crazy Office…';
    window.__CRAZY_OFFICE_READY=false;
    try{await loadGameRobust();}catch(e){console.error(e);fatal('game.js could not load. Replace BOTH 4.3 files together.');return;}
    let waited=0;
    const verify=setInterval(()=>{
      waited+=100;
      if(window.__CRAZY_OFFICE_READY){clearInterval(verify);finished=true;status.textContent='Ready';enter.disabled=false;preview.disabled=false;}
      else if(waited>=5000){clearInterval(verify);fatal('game initialization did not finish. Refresh after replacing both files.');}
    },100);
  }
  boot();
})();
</script>
</body>
</html>
